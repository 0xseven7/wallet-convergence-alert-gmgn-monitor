<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GMGN Main Screen Helper</title>
  <style>
    body {
      margin: 0;
      background: #10141d;
      color: #f4f7fb;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 28px;
    }
    h1 {
      font-size: 24px;
      margin: 0 0 20px;
    }
    label {
      display: grid;
      gap: 8px;
      margin: 18px 0;
      color: #c9d3e3;
    }
    input,
    select {
      box-sizing: border-box;
      width: 100%;
      border: 1px solid #344157;
      border-radius: 8px;
      background: #151b27;
      color: #f4f7fb;
      padding: 12px 14px;
      font: inherit;
    }
    .row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 18px 0;
      color: #c9d3e3;
    }
    .row input {
      width: auto;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 20px;
    }
    button {
      border: 0;
      border-radius: 8px;
      background: #5d72ff;
      color: white;
      padding: 12px 18px;
      font: inherit;
      cursor: pointer;
    }
    button.secondary {
      background: #253044;
    }
    #status {
      display: inline-block;
      margin-top: 16px;
      color: #89d69b;
    }
  </style>
</head>
<body>
  <main>
    <h1>GMGN Main Screen Helper</h1>
    <div class="row">
      <input type="checkbox" id="enabled" />
      <span>接收 relay 的主屏跳转事件</span>
    </div>
    <label>
      Relay Base URL
      <input id="relayBaseUrl" type="url" placeholder="https://market-watch.macmini.lan" />
    </label>
    <label>
      Market Watch Desk Base URL
      <input id="marketWatchDeskBaseUrl" type="url" placeholder="http://127.0.0.1:17387" />
    </label>
    <label>
      打开方式
      <select id="openMode">
        <option value="reuse-tab">复用主屏标签页</option>
        <option value="new-tab">每次新建标签页</option>
      </select>
    </label>
    <div class="row">
      <input type="checkbox" id="hideGmgnHeaderActions" />
      <span>隐藏 GMGN 标题栏社交按钮</span>
    </div>
    <div class="actions">
      <button id="save" type="button">保存</button>
      <button id="checkRelay" class="secondary" type="button">检查 Relay</button>
      <button id="testOpenGmgn" class="secondary" type="button">测试打开 GMGN</button>
    </div>
    <span id="status"></span>
  </main>
  <script src="options.js"></script>
</body>
</html>
