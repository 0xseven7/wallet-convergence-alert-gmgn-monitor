<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GMGN 提示设置</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div id="toast" class="toast"></div>

    <main class="popup-shell">
      <section class="card">
        <div class="card-heading">
          <div>
            <h2>推特语音设置</h2>
            <p class="card-subtitle">聚合买入提醒已恢复为原始蜂鸣音。Twitter 提醒全部走 TTS，这里仅管理语音提示和事件筛选。</p>
          </div>
          <label class="switch">
            <input type="checkbox" id="masterToggle" />
            <span class="slider"></span>
          </label>
        </div>

        <div class="setting-list">
          <div class="setting-row tts-panel">
            <span>TTS 语音风格</span>
            <p class="setting-help">用于所有 Twitter 提醒；不再播放默认 MP3 或账号映射音频。</p>

            <div class="tts-select-row">
              <select id="ttsVoiceSelect"></select>
              <button id="ttsTestBtn" class="secondary accent tts-test-btn" type="button">试听语音</button>
            </div>

            <div class="tts-range-row">
              <select id="ttsRateSelect"></select>
              <select id="ttsPitchSelect"></select>
            </div>

            <label class="setting-row">
              <span>TTS 代理线路</span>
              <select id="ttsApiPresetSelect"></select>
            </label>

            <label class="setting-row">
              <span>TTS 代理地址</span>
              <input id="ttsApiUrlInput" type="url" placeholder="例如 http://tts.macmini.lan/tts/v3-task" />
            </label>
          </div>

          <label class="setting-row">
            <span>提示音量</span>
            <div class="range-row">
              <input id="globalVolume" type="range" min="0" max="2" step="0.05" value="1" />
              <span id="volumePercent">100%</span>
            </div>
          </label>

          <div class="setting-row">
            <span>推特事件筛选</span>
            <div class="filter-grid">
              <label><input id="filterTweet" type="checkbox" /> 推文</label>
              <label><input id="filterRepost" type="checkbox" /> 转推</label>
              <label><input id="filterReply" type="checkbox" /> 回复</label>
              <label><input id="filterQuote" type="checkbox" /> 引用</label>
              <label><input id="filterOther" type="checkbox" /> 其他</label>
            </div>
          </div>
        </div>
      </section>

      <section class="card">
        <div class="card-heading">
          <div>
            <h2>语音特别关注钱包</h2>
            <p class="card-subtitle">这套名单和 GMGN 自带星标无关。只有加入这里的钱包，后续在 follow 信息流里出现新买卖时才会触发 TTS。</p>
          </div>
        </div>

        <div class="form-stack">
          <input type="text" id="speechWatchWallet" placeholder="GMGN follow 里显示的钱包名，例如：西瓜" />
          <input type="text" id="speechWatchAlias" placeholder="播报名（可选），例如：西瓜哥" />
          <button id="addSpeechWatchBtn" class="primary" type="button">添加语音关注</button>
          <div id="speechWatchList" class="list-container"></div>
        </div>
      </section>

      <section class="card">
        <div class="card-heading">
          <div>
            <h2>黑名单钱包</h2>
            <p class="card-subtitle">黑名单钱包不会改变原有聚合与提醒逻辑，只会在 GMGN 页面里额外显示一个 ! 标记。</p>
          </div>
        </div>

        <div class="form-stack">
          <input type="text" id="blacklistWallet" placeholder="GMGN follow 里显示的钱包名，例如：西瓜" />
          <button id="addBlacklistBtn" class="primary" type="button">添加黑名单钱包</button>
          <div id="blacklistList" class="list-container"></div>
        </div>
      </section>

    </main>

    <script src="popup.js"></script>
  </body>
</html>
